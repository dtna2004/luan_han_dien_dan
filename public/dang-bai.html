<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Đăng câu hỏi mới - Luận Hạn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@600;700&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<header class="site-header">
  <div class="container">
    <div class="brand">
      <span class="glyph">卦</span>
      <div>
        <h1>Luận Hạn</h1>
        <div class="tagline">Ngân hàng câu hỏi luận đoán Tứ Trụ &amp; Tử Vi</div>
      </div>
    </div>
    <div class="header-actions" id="header-auth-slot"></div>
  </div>
</header>

<main class="form-page" style="max-width:640px;">
  <h2>Đăng câu hỏi mới</h2>
  <p class="field-hint" style="margin-bottom:16px;">Câu hỏi của bạn sẽ ở trạng thái <strong>chờ duyệt</strong> cho đến khi quản trị viên xem và phê duyệt. Tên hiển thị tác giả sẽ là tên đăng nhập của bạn.</p>

  <div id="login-required" style="display:none;" class="form-card">
    Bạn cần <a href="/dang-nhap.html?redirect=%2Fdang-bai.html">đăng nhập</a> để đăng câu hỏi mới.
  </div>

  <div class="form-card" id="submit-card" style="display:none;">
    <div class="form-message" id="form-message"></div>
    <form id="question-form">
      <fieldset>
        <legend>Thông tin lá số</legend>
        <div class="field">
          <label for="birth-raw">Mô tả ngày sinh (bắt buộc)</label>
          <input type="text" id="birth-raw" required placeholder="VD: Nam mệnh: 16:40 ngày 28 tháng 4 năm 1974. Nơi sinh: Mỹ" />
        </div>
        <div class="field-row">
          <div class="field">
            <label for="gender">Giới tính</label>
            <select id="gender">
              <option value="Nam">Nam</option>
              <option value="Nữ">Nữ</option>
            </select>
          </div>
          <div class="field">
            <label for="calendar-type">Loại lịch</label>
            <select id="calendar-type">
              <option value="Dương lịch">Dương lịch</option>
              <option value="Âm lịch">Âm lịch</option>
            </select>
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="location">Nơi sinh</label>
            <input type="text" id="location" placeholder="VD: Hà Nội" />
          </div>
          <div class="field">
            <label for="country">Quốc gia</label>
            <input type="text" id="country" placeholder="VD: Việt Nam" />
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>Câu hỏi</legend>
        <div class="field">
          <label for="category">Chuyên mục</label>
          <input type="text" id="category" required placeholder="VD: Sức khỏe, Hôn nhân, Sự nghiệp..." />
        </div>
        <div class="field">
          <label for="question-text">Nội dung câu hỏi</label>
          <textarea id="question-text" required placeholder="VD: Năm 1996 người này xảy ra chuyện gì?"></textarea>
        </div>
        <div class="field">
          <label>4 lựa chọn</label>
          <div class="option-editor-row"><span class="option-letter">A.</span><input type="text" id="opt-a" required /></div>
          <div class="option-editor-row"><span class="option-letter">B.</span><input type="text" id="opt-b" required /></div>
          <div class="option-editor-row"><span class="option-letter">C.</span><input type="text" id="opt-c" required /></div>
          <div class="option-editor-row"><span class="option-letter">D.</span><input type="text" id="opt-d" required /></div>
        </div>
        <div class="field">
          <label for="answer">Đáp án đúng</label>
          <select id="answer" required>
            <option value="A">A</option>
            <option value="B">B</option>
            <option value="C">C</option>
            <option value="D">D</option>
          </select>
        </div>
      </fieldset>

      <button type="submit" class="btn btn-primary" style="width:100%;">Gửi để duyệt</button>
    </form>
  </div>
</main>

<script src="/js/common.js"></script>
<script src="/js/dang-bai.js"></script>
</body>
</html>
