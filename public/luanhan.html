<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Luận Hạn - Ngân hàng câu hỏi luận đoán Tứ Trụ</title>
  <meta name="description" content="Kho câu hỏi luận đoán vận hạn theo lá số Tứ Trụ/Bát Tự, kèm đáp án và thảo luận." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@600;700&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css" />
</head>

<body>
  <header class="site-header">
    <div class="container">
      <div class="brand">
        <span class="glyph">卦</span>
        <div>
          <h1>Luận Hạn</h1>
          <div class="tagline">Ngân hàng câu hỏi luận đoán Tứ Trụ &amp; Tử Vi</div>
        </div>
      </div>
      <div class="header-actions" id="header-auth-slot"></div>
    </div>
  </header>

  <main class="container">
    <div class="filter-bar">
      <input type="search" id="search-input" placeholder="Tìm theo câu hỏi, ngày sinh, mã số..." />
      <select id="category-select">
        <option value="">Tất cả chuyên mục</option>
      </select>
    </div>

    <div id="case-list" class="case-list">
      <div class="loading-line">Đang tải dữ liệu...</div>
    </div>

    <div id="pagination" class="pagination"></div>
  </main>

  <footer class="site-footer">Luận Hạn — một chuyên mục của tuvi.id.vn</footer>

  <script src="./js/common.js"></script>
  <script src="./js/luanhan.js"></script>
</body>

</html>
