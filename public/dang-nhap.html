<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng nhập - Luận Hạn</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@600;700&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css" />
</head>

<body>
  <header class="site-header">
    <div class="container">
      <div class="brand">
        <span class="glyph">卦</span>
        <div>
          <h1>Luận Hạn</h1>
          <div class="tagline">Ngân hàng câu hỏi luận đoán Tứ Trụ &amp; Tử Vi</div>
        </div>
      </div>
      <div class="header-actions" id="header-auth-slot"></div>
    </div>
  </header>

  <main class="form-page">
    <h2>Đăng nhập</h2>
    <div class="form-card">
      <div class="form-message" id="form-message"></div>
      <form id="login-form">
        <div class="field">
          <label for="identifier">Tên đăng nhập hoặc email</label>
          <input type="text" id="identifier" required autocomplete="username" />
        </div>
        <div class="field">
          <label for="password">Mật khẩu</label>
          <input type="password" id="password" required autocomplete="current-password" />
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;">Đăng nhập</button>
      </form>
    </div>
    <div class="form-footer-link">Chưa có tài khoản? <a href="dang-ky.html">Đăng ký ngay</a></div>
  </main>

  <script src="./js/common.js"></script>
  <script src="./js/auth-pages.js"></script>
  <script>initLoginPage();</script>
</body>

</html>
