<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng ký - Luận Hạn</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@600;700&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css" />
</head>

<body>
  <header class="site-header">
    <div class="container">
      <div class="brand">
        <span class="glyph">卦</span>
        <div>
          <h1>Luận Hạn</h1>
          <div class="tagline">Ngân hàng câu hỏi luận đoán Tứ Trụ &amp; Tử Vi</div>
        </div>
      </div>
      <div class="header-actions" id="header-auth-slot"></div>
    </div>
  </header>

  <main class="form-page">
    <h2>Đăng ký tài khoản</h2>
    <div class="form-card">
      <div class="form-message" id="form-message"></div>
      <form id="register-form">
        <div class="field">
          <label for="username">Tên đăng nhập</label>
          <input type="text" id="username" required pattern="[a-z0-9_.]{3,30}" autocomplete="username" />
          <div class="field-hint">Chữ thường, số, dấu chấm/gạch dưới, 3-30 ký tự. Đây cũng là tên hiển thị khi đăng
            bài/bình luận.</div>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" required autocomplete="email" />
        </div>
        <div class="field">
          <label for="password">Mật khẩu</label>
          <input type="password" id="password" required minlength="6" autocomplete="new-password" />
          <div class="field-hint">Tối thiểu 6 ký tự.</div>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;">Đăng ký</button>
      </form>
    </div>
    <div class="form-footer-link">Đã có tài khoản? <a href="dang-nhap.html">Đăng nhập</a></div>
  </main>

  <script src="./js/common.js"></script>
  <script src="./js/auth-pages.js"></script>
  <script>initRegisterPage();</script>
</body>

</html>
